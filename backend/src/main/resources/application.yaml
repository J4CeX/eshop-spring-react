server:
    port: 8081

spring:
    application:
        name: backend
    datasource:
        url: jdbc:postgresql://localhost:5432/eshop_base
        username: postgres
        password: postgres
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect